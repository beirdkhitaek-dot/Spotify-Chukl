plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.chukl.spotifychukl'
    compileSdk 34
    defaultConfig {
        applicationId "com.chukl.spotifychukl"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }
    signingConfigs {
        chukl {
            storeFile file('chukl.keystore')
            storePassword 'chukl123'
            keyAlias 'chukl'
            keyPassword 'chukl123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.chukl }
        release { signingConfig signingConfigs.chukl }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
