name: Build Spotify Chukl app
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: android-app
        run: gradle assembleDebug --no-daemon
      - name: Name APK with version
        run: |
          mkdir -p out
          V=$(grep versionName android-app/app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          cp android-app/app/build/outputs/apk/debug/*.apk "out/SpotifyChukl-v$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SpotifyChukl-APK
          path: out/*.apk
