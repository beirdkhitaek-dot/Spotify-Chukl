name: Build ESP addon
on:
  workflow_dispatch:
  push:
    paths: ['krispy-esp-addon/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: krispy-esp-addon
        run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: this-is-what-you-get-esp-0.3.0
          path: |
            krispy-esp-addon/build/libs/*.jar
            !krispy-esp-addon/build/libs/*-sources.jar
            !krispy-esp-addon/build/libs/*-dev.jar
